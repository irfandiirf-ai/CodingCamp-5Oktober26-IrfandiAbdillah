<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Theme Toggle Button -->
  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle light/dark theme">🌙</button>

  <!-- ===== HEADER: Greeting & Clock ===== -->
  <header class="widget" id="clock-widget">
    <div class="greeting-row">
      <span id="greeting" class="greeting">Good Morning</span>
      <span id="user-name" class="user-name" title="Click to edit name">Guest</span>
      <button id="btn-edit-name" class="btn-icon" aria-label="Edit name">✏️</button>
    </div>
    <p id="clock" class="clock">00:00:00</p>
    <p id="date-display" class="date-display">Loading...</p>
  </header>

  <main class="dashboard-grid">

    <!-- ===== FOCUS TIMER ===== -->
    <section class="widget" id="timer-widget" aria-label="Focus Timer">
      <h2 class="widget-title">&#9201; Focus Timer</h2>
      <div id="timer-display" class="timer-display" aria-live="polite">25:00</div>
      <div class="timer-controls">
        <button id="btn-start" class="btn btn-primary" aria-label="Start timer">&#9654; Start</button>
        <button id="btn-pause" class="btn btn-secondary" aria-label="Pause timer" disabled>&#9646;&#9646; Pause</button>
        <button id="btn-stop"  class="btn btn-secondary" aria-label="Stop timer"  disabled>&#9632; Stop</button>
        <button id="btn-reset" class="btn btn-ghost"     aria-label="Reset timer">&#8635; Reset</button>
      </div>
    </section>

    <!-- ===== TO-DO LIST ===== -->
    <section class="widget" id="todo-widget" aria-label="To-Do List">
      <h2 class="widget-title">&#10003; To-Do List</h2>

      <div class="add-row">
        <input
          type="text"
          id="task-input"
          class="text-input"
          placeholder="Add a new task…"
          maxlength="200"
          aria-label="New task text"
        />
        <button id="btn-add-task" class="btn btn-primary" aria-label="Add task">+ Add</button>
      </div>
      <p id="task-error" class="field-error" aria-live="polite" hidden>Task cannot be empty.</p>

      <ul id="task-list" class="item-list" aria-label="Task list"></ul>
    </section>

    <!-- ===== QUICK LINKS ===== -->
    <section class="widget" id="links-widget" aria-label="Quick Links">
      <h2 class="widget-title">&#128279; Quick Links</h2>

      <div id="links-grid" class="links-grid" aria-label="Shortcut links"></div>

      <details class="add-link-details">
        <summary class="add-link-summary">+ Add Link</summary>
        <div class="add-link-form">
          <input
            type="text"
            id="link-title-input"
            class="text-input"
            placeholder="Title (e.g. GitHub)"
            maxlength="40"
            aria-label="Link title"
          />
          <input
            type="url"
            id="link-url-input"
            class="text-input"
            placeholder="URL (e.g. https://github.com)"
            maxlength="500"
            aria-label="Link URL"
          />
          <button id="btn-add-link" class="btn btn-primary" aria-label="Save link">Save Link</button>
          <p id="link-error" class="field-error" aria-live="polite" hidden>Title and URL are required.</p>
        </div>
      </details>
    </section>

  </main>

  <!-- ===== EDIT TASK MODAL ===== -->
  <div id="edit-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-box">
      <h3 id="modal-title" class="modal-title">Edit Task</h3>
      <input
        type="text"
        id="edit-task-input"
        class="text-input"
        maxlength="200"
        aria-label="Edit task text"
      />
      <p id="edit-error" class="field-error" aria-live="polite" hidden>Task cannot be empty.</p>
      <div class="modal-actions">
        <button id="btn-save-edit"   class="btn btn-primary">Save</button>
        <button id="btn-cancel-edit" class="btn btn-ghost">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
